
name: Compile xpwn and idevicererestore (Windows)
on: [push]
jobs:
  xpwn-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v3

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: Build with CMake directly
        run: |
          cd ./src/xpwn
          mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DZLIB_INCLUDE_DIR=/mingw64/include \
            -DZLIB_LIBRARY=/mingw64/lib/libz.a \
            ..
          make -j$(nproc)
          mkdir -p ../../../bin
          cp -r bin/* ../../../bin/ 2>/dev/null || cp *.exe ../../../bin/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: xpwn_win
          path: bin/

  idevicererestore-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v3

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            cmake
            autoconf
            automake
            libtool
            pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: Run compile script
        run: |
          cd ./src/idevicererestore
          ./compile.sh patch
          mv idevicerestore/bin ../..
          cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: idevicererestore_win
          path: bin/
